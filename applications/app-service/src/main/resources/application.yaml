server:
  port: 9003
spring:
  application:
    name: "Persona"
  devtools:
    add-properties: false
  r2dbc:
    host: "db_personas"
    port: 5432
    database: "personasDB"
    schema: "public"
    username: "postgres"
    password: 1234
  sql:
    init:
      mode: "never"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:9003"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://bootcamp:9002"
resilience4j:
  circuitbreaker:
    instances:
      obtenerBootcamp:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      enviarReporte:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
